name: Bug
description: Something that worked, or should work, is wrong
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in plain words for QA, BA and clients. Say what a person does and sees. No code.
  - type: input
    id: area
    attributes:
      label: Area
      description: The page or part of the app, for example dashboard or reviews-list.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - crash
        - wrong-data
        - performance
        - ui
        - wrong-output
        - intermittent
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: dropdown
    id: reproduction
    attributes:
      label: Could you reproduce it?
      options:
        - reproduced
        - partly-reproduced
        - cannot-reproduce
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What must be true when this is fixed, in plain words.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Only actions a user does, numbered. If specific data must exist, say so inside the steps with the real names and numbers.
      placeholder: |
        1. Open this address
        2. Click this button
        3. Look at this
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen, with the exact value or text.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead, with the exact value or text.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - staging
        - production
        - to confirm
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Screenshot, recording, error text, or what is still to be added.
