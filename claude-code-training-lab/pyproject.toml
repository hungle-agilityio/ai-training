[project]
name = "reviewradar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Django>=5.0,<6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reviewradar.settings"
python_files = ["test_*.py"]
testpaths = ["reviews/tests"]
addopts = "--cov=reviews --cov-report=term-missing"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "reviewradar.settings"
