[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskpilot.settings"
python_files = ["test_*.py"]
testpaths = ["tasks/tests"]
addopts = "--cov=tasks --cov-report=term-missing"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "taskpilot.settings"
