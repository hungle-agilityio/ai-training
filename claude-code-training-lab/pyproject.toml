[project]
name = "reviewradar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []  # dependencies are pinned in requirements.txt

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reviewradar.settings"
python_files = ["test_*.py"]
testpaths = ["reviews/tests"]
addopts = "--cov=reviews --cov-report=term-missing"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "reviewradar.settings"
