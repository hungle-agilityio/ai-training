# The 18 labels of the flow, as on hungle-agilityio/ai-training today.

[[label]]
name = "agent:ready"
color = "0E8A16"
description = "Decided and ready for the work-queue loop"

[[label]]
name = "agent:running"
color = "FBCA04"
description = "The loop is building this issue"

[[label]]
name = "agent:review"
color = "1D76DB"
description = "Pull request open, waiting for the owner's review"

[[label]]
name = "agent:failed"
color = "D93F0B"
description = "The loop stopped; a human decides"

[[label]]
name = "agent:manual"
color = "BFD4F2"
description = "Built in an interactive session, not by the loop"

[[label]]
name = "agent:needs-permission"
color = "FBCA04"
description = "The loop may not write a file this issue needs; waits for an allow rule"

[[label]]
name = "pr:ready-for-review"
color = "0E8A16"
description = "CI is green and the verify report passed; waiting for the owner"

[[label]]
name = "pr:changes-requested"
color = "FBCA04"
description = "the owner asked for a change and the loop is working on it"

[[label]]
name = "pr:blocked"
color = "B60205"
description = "the loop cannot go on without the owner; the reason is a comment on the pull request"

[[label]]
name = "pr:ci-failed"
color = "D93F0B"
description = "CI is still red after the loop tried to fix it twice"

[[label]]
name = "risk:low"
color = "0E8A16"
description = "Low risk task"

[[label]]
name = "risk:medium"
color = "FBCA04"
description = "Medium risk task"

[[label]]
name = "risk:high"
color = "B60205"
description = "High risk task: needs-info round, review on the MacBook"

[[label]]
name = "needs-ui"
color = "1D76DB"
description = "Changes what users see"

[[label]]
name = "area:flow"
color = "5319E7"
description = "The workflow: loop, hooks, skills, specs, CI"

[[label]]
name = "area:app"
color = "1D76DB"
description = "The ReviewRadar app and its hosting"

[[label]]
name = "epic"
color = "3E4B9E"
description = "A goal made of several issues"

[[label]]
name = "needs-info"
color = "D876E3"
description = "Something is still unconfirmed"
