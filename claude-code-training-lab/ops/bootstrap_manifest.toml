# What ops/bootstrap.py copies into a new repository, never inferred.
# scope "app": path inside the app folder. scope "root": path at the git root.
# A directory is copied whole. An entry that does not exist is reported and skipped.

exclude = ["__pycache__", ".pytest_cache", ".ruff_cache", ".mypy_cache", "ops/flow.toml"]

