<title>ReviewRadar Prototype</title>
<meta name="robots" content="noindex, nofollow">
<!--
  ReviewRadar prototype: every screen of the app, clickable, on demo data, in one file.
  Source of truth for the UI (ADR-030). Open a screen directly with #<scenario>, for example
  #dashboard, #dashboard-empty, #settings-goal-error. Add ?bare to hide the prototype bar.
  Demo data comes from `manage.py seed_demo_data`; nothing here is customer data.
-->
<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #e3e8f2;
  --text: #16203a;
  --muted: #5d6985;
  --brand: #3b5bdb;
  --brand-soft: #e8edff;
  --sidebar: #101a36;
  --sidebar-text: #c4cce2;
  --star: #f5a524;
  --star-empty: #d5dbea;
  --good: #1a7f4b;
  --good-soft: #e0f5ea;
  --warn: #9a6700;
  --warn-soft: #fff3d1;
  --bad: #c0332b;
  --bad-soft: #fde7e5;
  --neutral-soft: #eceff6;
  --shadow: 0 1px 2px rgba(16, 26, 54, .06), 0 4px 16px rgba(16, 26, 54, .04);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {--bg: #0c1122;
    --surface: #151c33;
    --border: #252e4d;
    --text: #e8ecf8;
    --muted: #9aa5c4;
    --brand: #7b93ff;
    --brand-soft: #1f2a52;
    --sidebar: #090d1a;
    --star-empty: #34406a;
    --good: #5fd39a;
    --good-soft: #12362a;
    --warn: #f1c55a;
    --warn-soft: #3b3010;
    --bad: #ff8f87;
    --bad-soft: #43191a;
    --neutral-soft: #222b49;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {--bg: #0c1122;
    --surface: #151c33;
    --border: #252e4d;
    --text: #e8ecf8;
    --muted: #9aa5c4;
    --brand: #7b93ff;
    --brand-soft: #1f2a52;
    --sidebar: #090d1a;
    --star-empty: #34406a;
    --good: #5fd39a;
    --good-soft: #12362a;
    --warn: #f1c55a;
    --warn-soft: #3b3010;
    --bad: #ff8f87;
    --bad-soft: #43191a;
    --neutral-soft: #222b49;
    --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
}
h1, h2, p { margin: 0; }

.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar {
  background: var(--sidebar);
  color: var(--sidebar-text);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  color: #fff; text-decoration: none;
  font-size: 19px; font-weight: 700; letter-spacing: -.01em;
  padding: 0 8px;
}
.brand-mark { color: #7b93ff; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--sidebar-text); text-decoration: none; font-weight: 500;
}
.nav-item em {
  margin-left: auto; font-style: normal; font-size: 11px;
  padding: 2px 8px; border-radius: 999px;
  background: rgba(255, 255, 255, .08);
}
.nav-item.is-active { background: rgba(123, 147, 255, .18); color: #fff; }
.nav-item.is-disabled { opacity: .55; cursor: default; }
.sidebar-note { margin-top: auto; font-size: 13px; padding: 0 8px; opacity: .7; }
.account {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 10px 0; border-top: 1px solid rgba(196, 204, 226, .2); font-size: 13px;
}
.account strong { color: #fff; overflow-wrap: anywhere; }
.account-button {
  border: 1px solid rgba(196, 204, 226, .35); background: transparent; color: #fff;
  border-radius: 8px; padding: 5px 12px; font: inherit; font-weight: 600; cursor: pointer;
}
.account-button:hover { border-color: #7b93ff; }
.account-button:focus-visible { outline: 2px solid #7b93ff; outline-offset: 2px; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 28px 32px 8px;
}
.topbar h1 { font-size: 26px; letter-spacing: -.02em; }
.subtitle { color: var(--muted); margin-top: 2px; }
.button {
  display: inline-block; padding: 9px 16px; border-radius: 10px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); text-decoration: none; font-weight: 600; font-size: 14px;
  white-space: nowrap;
}
.button:hover { border-color: var(--brand); color: var(--brand); }
.export-action { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.export-note { margin: 0; color: var(--muted); font-size: 12.5px; }
.content { padding: 16px 32px 32px; display: flex; flex-direction: column; gap: 20px; flex: 1; }
.footer { padding: 16px 32px 28px; color: var(--muted); font-size: 13px; }

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px;
}
.kpi-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kpi-value { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
.kpi-unit { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi-hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
.kpi-hint .kpi-overdue { color: var(--bad); font-weight: 600; }
.kpi-alert { border-color: var(--bad); }
.kpi-alert .kpi-value { color: var(--bad); }

/* Panels */
.grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px;
}
.panel-head { margin-bottom: 14px; }
.panel-head h2 { font-size: 17px; letter-spacing: -.01em; }
.panel-head p, .muted { color: var(--muted); font-size: 13.5px; }
.empty { text-align: center; padding: 56px 24px; }
.empty h2 { font-size: 20px; margin-bottom: 6px; }

/* Table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
.table thead th {
  font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-weight: 600;
}
.table tbody th { font-weight: 600; }
.table .row-link { color: inherit; text-decoration: none; display: inline-block; padding: 8px 0; }
.table .row-link:hover, .table .row-link:focus-visible { text-decoration: underline; }
.table .row-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.table tbody tr:last-child th, .table tbody tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.rating-cell { display: flex; align-items: center; gap: 10px; }
.rating-cell strong { min-width: 28px; font-variant-numeric: tabular-nums; }

/* Stars */
.stars {
  position: relative; display: inline-block; white-space: nowrap;
  font-size: 16px; letter-spacing: 2px; line-height: 1; color: var(--star-empty);
}
.stars::before { content: "★★★★★"; }
.stars > span {
  position: absolute; inset: 0 auto 0 0; width: var(--pct, 0%);
  overflow: hidden; color: var(--star);
}
.stars > span::before { content: "★★★★★"; }

/* Badges */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--neutral-soft); color: var(--muted);
}
.badge-excellent, .badge-positive { background: var(--good-soft); color: var(--good); }
.badge-watch { background: var(--warn-soft); color: var(--warn); }
.badge-attention, .badge-negative { background: var(--bad-soft); color: var(--bad); }
.badge-neutral { background: var(--neutral-soft); color: var(--muted); }
.followup-open { background: var(--bad-soft); color: var(--bad); }
.followup-contacted { background: var(--brand-soft); color: var(--brand); }
.followup-resolved { background: var(--good-soft); color: var(--good); }

/* Rating breakdown */
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.bar-link {
  display: grid; grid-template-columns: 38px 1fr 32px; align-items: center; gap: 10px;
  padding: 8px 6px; margin: -8px -6px; border-radius: 8px; color: inherit; text-decoration: none;
}
.bar-link:hover, .bar-link:focus-visible { background: var(--neutral-soft); }
.bar-link:hover .bar-label, .bar-link:focus-visible .bar-label { text-decoration: underline; }
.bar-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.bar-label { font-weight: 600; font-variant-numeric: tabular-nums; }
.bar-label span { color: var(--star); }
.bar-track { height: 10px; border-radius: 999px; background: var(--neutral-soft); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.bar-5, .bar-4 { background: var(--good); }
.bar-3 { background: var(--star); }
.bar-2, .bar-1 { background: var(--bad); }
.bar-count { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Reviews */
.reviews { list-style: none; margin: 0; padding: 0; }
.review { padding: 14px 0; border-bottom: 1px solid var(--border); }
.review:last-child { border-bottom: 0; padding-bottom: 0; }
.review:first-child { padding-top: 0; }
.review-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
.review-top time { margin-left: auto; color: var(--muted); font-size: 13px; }
.review p { color: var(--text); }

/* Reviews table and pagination */
.reviews-table th, .reviews-table td { vertical-align: top; }
.reviews-table .review-text { min-width: 260px; max-width: 520px; }
.nowrap { white-space: nowrap; }
.reviews-table .review-text { overflow-wrap: anywhere; }
.expandable { cursor: help; border-bottom: 1px dotted var(--muted); }
.expandable .text-full {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.expandable:hover .text-short, .expandable:focus .text-short { display: none; }
.expandable:hover .text-full, .expandable:focus .text-full {
  position: static; width: auto; height: auto; overflow: visible;
  clip: auto; white-space: normal;
}
.expandable:focus-visible, .pager-link:focus-visible, .nav-item:focus-visible, .button:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px;
}
.pager {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
}
.pager-summary { color: var(--muted); font-size: 14px; }
.pager-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pager-link {
  display: inline-block; min-width: 36px; padding: 6px 12px; text-align: center;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
a.pager-link:hover { border-color: var(--brand); color: var(--brand); }
.pager-link.is-current { background: var(--brand); border-color: var(--brand); color: #fff; }
.pager-link.is-disabled { opacity: .45; cursor: not-allowed; }
.pager-gap { padding: 0 4px; color: var(--muted); }

/* Responsive */
@container app (max-width: 1000px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: 1fr; }
}
@container app (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; gap: 12px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav-item.is-disabled, .sidebar-note { display: none; }
  .account {
    width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center;
    justify-content: space-between; padding: 8px 4px 0;
  }
  .topbar { flex-direction: column; align-items: flex-start; padding: 20px 16px 4px; }
  .content { padding: 12px 16px 24px; }
  .footer { padding: 12px 16px 24px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 12px; }
  .kpi-value { font-size: 26px; }
}

.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.filters .field { display: flex; flex-direction: column; gap: 4px; }
.filters label { color: var(--muted); font-size: 13px; font-weight: 600; }
.filters select, .filters input { font: inherit; height: 40px; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.filters .field-hint { color: var(--muted); font-size: 12.5px; }
.filter-actions { display: flex; gap: 8px; margin-top: 21px; }
.filter-actions .button {
  box-sizing: border-box; width: 96px; height: 40px; padding: 0; border-radius: 8px; text-align: center;
  font: inherit; font-weight: 600; line-height: 38px; cursor: pointer;
}
.filter-actions .button-apply, .filter-actions .button-apply:hover { background: var(--good); border-color: var(--good); color: var(--bg); }
.filter-actions .button-clear, .filter-actions .button-clear:hover { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.filter-actions .button:hover { filter: brightness(.92); }
.alert { margin: 12px 20px 0; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.filter-week-label { margin: 0; padding: 10px 20px 0; color: var(--muted); font-size: 13.5px; }
.review-count { margin: 0; padding: 12px 20px 8px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
@container app (max-width: 760px) {
  .filters .field, .filters select, .filters input { width: 100%; }
  .filter-actions { width: 100%; margin-top: 0; }
  .filter-actions .button { flex: 1; width: auto; }
}

/* Sign-in */
.signin-page { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.signin-card { width: 100%; max-width: 400px; padding: 32px; }
.signin-brand {
  display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  color: var(--text); font-size: 19px; font-weight: 700; letter-spacing: -.01em;
}
.signin-brand .brand-mark { color: var(--brand); }
.signin-card h1 { font-size: 24px; letter-spacing: -.01em; margin-bottom: 4px; }
.signin-form { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }
.signin-form label { font-weight: 600; font-size: 13.5px; margin-top: 8px; }
.signin-form input[type="text"], .signin-form input[type="password"] {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
}
.signin-form input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.signin-submit { margin-top: 16px; background: var(--brand); border-color: var(--brand); color: var(--bg); }
.signin-submit:hover { background: var(--brand); color: var(--bg); opacity: .9; }
.signin-error, .signin-field-error { color: var(--bad); font-size: 13.5px; }
.signin-error { background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }
.signin-help { margin-top: 20px; }
@container app (max-width: 400px) {
  .signin-card { padding: 24px 16px; }
}

.location-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); margin-bottom: 20px; }
.location-side { display: grid; gap: 20px; align-content: start; min-width: 0; }
.score-value { font-size: 36px; letter-spacing: -.02em; }
.see-all { margin: 14px 0 0; }
.bars .bar-link { cursor: default; }
.bars .bar-link:hover { background: none; }
.bars .bar-link:hover .bar-label { text-decoration: none; }
@container app (max-width: 900px) { .location-grid { grid-template-columns: 1fr; } }

/* Weekly trend: HTML and CSS only */
.trend-panel { margin-bottom: 20px; }
.trend-chart { list-style: none; margin: 0 0 16px; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.trend-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center; font-size: 12px; }
.trend-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.trend-plot { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 120px; border-bottom: 1px solid var(--border); }
.trend-bar { display: block; width: 70%; max-width: 40px; background: var(--brand); border-radius: 4px 4px 0 0; }
.trend-week { color: var(--muted); white-space: nowrap; }
.trend-count { color: var(--muted); font-size: 11px; }
.trend-table th[scope="row"] { font-weight: 500; }
@container app (max-width: 480px) {
  .trend-chart { gap: 2px; }
  .trend-col { font-size: 10.5px; }
  .trend-count { font-size: 9.5px; white-space: normal; }
}

.report-table td, .report-table th[scope="col"]:not(:first-child) { text-align: right; }
.change-up { color: var(--good); font-weight: 600; }
.change-down { color: var(--bad); font-weight: 600; }
.change-same, .change-none { color: var(--muted); }
.report-note { padding: 12px 20px 16px; margin: 0; }

/* Compare */
.compare-verdict { margin: 0; padding: 12px 20px 0; font-weight: 600; }
.compare-message { margin: 0; padding: 16px 20px; color: var(--muted); }
.compare-message.is-bad { color: var(--bad); font-weight: 600; }
.compare-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.compare-table th, .compare-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
.compare-table thead th { color: var(--muted); font-size: 13px; }
.compare-table tbody th { font-weight: 600; }
.compare-bar { display: block; height: 6px; margin-top: 4px; border-radius: 999px; background: var(--neutral-soft); overflow: hidden; }
.compare-bar > span { display: block; height: 100%; background: var(--brand); }
@container app (max-width: 760px) {
  .compare-table th, .compare-table td { padding: 8px 10px; }
}
/* Reply column of the Reviews page. */
.reply-status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.reply-done { color: var(--good); }
.reply-open { color: var(--muted); }

/* Reply drafts page. */
#reply-queue .review-count {
  margin-bottom: 12px;
}

.reply-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.reply-tabs a { padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; text-decoration: none; }
.reply-tabs a[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.badge-overdue { margin-left: 8px; background: var(--bad-soft); color: var(--bad); }

.notice {
  margin: 0 0 16px;
  padding: 10px 14px;
  border: 1px solid var(--good);
  border-radius: 10px;
  color: var(--good);
  font-weight: 600;
}

.reply-review { margin-bottom: 16px; padding: 20px; }
.reply-review .review-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
.reply-review .review-body { margin: 0; white-space: pre-wrap; }
.reply-form { display: flex; flex-direction: column; gap: 8px; padding: 20px; }
.reply-form label { font-weight: 600; }
.reply-form textarea { width: 100%; min-height: 160px; padding: 10px; font: inherit; border: 1px solid var(--muted); border-radius: 10px; background: transparent; color: inherit; }
.reply-form .field-hint, .reply-form .last-saved { margin: 0; color: var(--muted); font-size: 13px; }
.reply-form .alert { margin: 0; }
.reply-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
.reply-actions button.button { cursor: pointer; background: var(--good); border-color: var(--good); color: var(--bg); }

/* Suggest a reply: a secondary (outline) button and the note above the box. */
.reply-actions button#suggest-reply { background: transparent; border-color: var(--good); color: var(--good); }
.reply-form .suggest-note { margin: 0; color: var(--good); font-size: 13px; font-weight: 600; }

/* Template picker above the reply box. */
.reply-template { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.reply-template-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.reply-template select { min-width: 220px; padding: 8px; font: inherit; border: 1px solid var(--muted); border-radius: 10px; background: transparent; color: inherit; }
.reply-template button.button { cursor: pointer; background: transparent; border-color: var(--good); color: var(--good); }

/* Follow-up box of a bad review, below the reply form. */
.followup .notice { margin: 0 0 12px; }
.followup-form { display: flex; flex-direction: column; gap: 8px; }
.followup-form label { font-weight: 600; font-size: 13.5px; }
.followup-form select, .followup-form textarea { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid var(--muted); border-radius: 10px; background: transparent; color: inherit; }
.followup-form textarea { min-height: 90px; }
.followup-form [aria-invalid="true"] { border-color: var(--bad); }

    return true;
  }).sort(byNewest);
}

/* ---- Import ---- */
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function importCsv(name, text) {
  if (P.failures) return { refusal: "The file could not be read. Save it again as CSV (UTF-8) and try once more." };
  if (!/\.csv$/i.test(name)) return { refusal: "Choose a .csv file." };
  const rows = parseCsv(text.replace(/^﻿/, ""));
  const head = (rows[0] || []).map((h) => h.trim().toLowerCase());
  if (["location", "rating", "review text", "date"].some((h, i) => head[i] !== h)) return { refusal: "The first row must be: Location, Rating, Review text, Date." };
  const result = { imported: 0, duplicates: 0, errors: [] };
  rows.slice(1).forEach((r, i) => {
    const n = i + 2, [loc, rating, text, date] = r.map((x) => (x ?? "").trim());
    const b = db.branches.find((x) => fold(x.name) === fold(loc || ""));
    if (!b) return result.errors.push([n, `Unknown location "${loc}"`]);
    if (!/^[1-5]$/.test(rating)) return result.errors.push([n, "Rating must be a whole number from 1 to 5"]);
    if (!text) return result.errors.push([n, "Review text is empty"]);
    const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/.exec(date || "");
    if (!m) return result.errors.push([n, "Date must look like 2026-11-01 or 2026-11-01 09:30"]);
    const at = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4] || "00"}:${m[5] || "00"}:00+07:00`);
    if (db.reviews.some((x) => x.b === b.id && x.rating === +rating && x.text === text && +x.at === +at)) { result.duplicates++; return; }
    db.reviews.push({ id: nextId(db.reviews), b: b.id, rating: +rating, text, at, reply: null, fu: null }); result.imported++;
  });
  return { result };
}

  const b = branch(id);
  if (!b) return S.notfound();
  const rs = reviewsOf(id), a = avg(rs.reduce((s, r) => s + r.rating, 0), rs.length);
  const bars = [5, 4, 3, 2, 1].map((n) => { const c = rs.filter((r) => r.rating === n).length, w = rs.length ? Math.round(c * 100 / rs.length) : 0;
    return `<li><div class="bar-link"><span class="bar-label">${n} <span aria-hidden="true">★</span></span><span class="bar-track" role="presentation"><span class="bar-fill bar-${n}" data-w="${w}%" style="width: 0%"></span></span><span class="bar-count">${c}</span></div></li>`; }).join("");
  const weeks = []; const m0 = monday(NOW);
  for (let i = 7; i >= 0; i--) { const start = new Date(m0.getTime() - i * 7 * 86400e3), end = new Date(start.getTime() + 7 * 86400e3);
    const w = rs.filter((r) => r.at >= start && r.at < end); weeks.push({ start, n: w.length, a: avg(w.reduce((s, r) => s + r.rating, 0), w.length) }); }
  const goal = b.goal === null ? `<p class="muted">No goal set.</p><p class="see-all">${link("settings-goals", "Set a goal", "")}</p>`
    : `<p>${f1(b.goal)} ${a === null ? `<span class="muted">No score yet</span>` : (b.goal - a > 0.04 ? badge("watch", `${f1(Math.round((b.goal - a) * 10) / 10)} short`) : badge("positive", "Met"))}</p><p class="see-all">${link("settings-goals", "Change goal", "")}</p>`;
  const topicRows = TOPICS.map((t) => { const w = rs.filter((r) => topicsOf(r.text).includes(t)); return { t, n: w.length, bad: w.filter(isBad).length }; }).filter((x) => x.n).sort((x, y) => y.n - x.n || y.bad - x.bad).slice(0, 3);
  const latest = [...rs].sort(byNewest).slice(0, 5).map((r) => `<tr class="review-row"><td>${stars(r.rating)}</td><td class="review-text" data-sensitive="review-text">${esc(r.text)}</td><td>${badge(...sentiment(r.rating))}</td>${timeCell(r.at)}</tr>`).join("");
  return shell("", esc(b.name), "Score, weekly trend and latest reviews for this location.", `<a class="button" href="#compare-${id}">Compare with another location</a>`, `
  <div class="grid location-grid"><div class="location-side">
    <section class="panel"><header class="panel-head"><h2>Score</h2></header>${a === null ? `<p class="muted">No reviews yet</p>` : `<div class="rating-cell"><strong class="score-value">${f1(a)}</strong>${stars(f1(a))}${badge(...status(a))}</div>`}<p class="review-count">${plural(rs.length, "review")}</p></section>
    <section class="panel" id="location-goal"><header class="panel-head"><h2>Goal</h2></header>${goal}</section></div>
    <section class="panel"><header class="panel-head"><h2>Rating breakdown</h2><p>Share of this location's reviews by star rating</p></header><ul class="bars">${bars}</ul></section></div>
  <section class="panel trend-panel"><header class="panel-head"><h2>Weekly trend</h2><p>Average rating per week, last 8 weeks (Monday to Sunday)</p></header>
    <ol class="trend-chart" aria-hidden="true">${weeks.map((w) => `<li class="trend-col"><span class="trend-value">${w.n ? f1(w.a) : "–"}</span><span class="trend-plot">${w.n ? `<span class="trend-bar" data-h="${w.a * 20}%" style="height: 0%"></span>` : ""}</span><span class="trend-week">${weekLabel(w.start)}</span><span class="trend-count">${plural(w.n, "review")}</span></li>`).join("")}</ol>
    <div class="table-wrap"><table class="table trend-table"><thead><tr><th scope="col">Week of</th><th scope="col">Average</th><th scope="col">Reviews</th></tr></thead><tbody>${weeks.map((w) => `<tr><th scope="row">${weekLabel(w.start)}</th><td>${w.n ? f1(w.a) : "No reviews"}</td><td>${w.n}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel" id="location-topics"><header class="panel-head"><h2>What customers talk about</h2><p>Top topics of all reviews</p></header>
    ${topicRows.length ? `<ul class="reviews">${topicRows.map((x) => `<li><a href="#reviews-location-${id}-topic-${x.t.slug}">${esc(x.t.label)}</a> <span class="muted">${plural(x.n, "review")}${x.bad ? ` · ${x.bad} bad` : ""}</span></li>`).join("")}</ul>` : `<p class="muted">No topics yet.</p>`}</section>
  <section class="panel"><header class="panel-head"><h2>Latest reviews</h2><p>The 5 newest reviews of this location</p></header>
    ${latest ? `<div class="table-wrap"><table class="table reviews-table"><thead><tr><th scope="col">Rating</th><th scope="col">Review text</th><th scope="col">Sentiment</th><th scope="col">Date</th></tr></thead><tbody>${latest}</tbody></table></div>` : `<p class="muted">No reviews yet.</p>`}
    <p class="see-all">${link(`reviews-location-${id}`, "See all reviews", "")}</p></section>`);
};

/* ---- Monthly report ---- */
S.reports = () => {
  const s = ui.reports ||= { month: "2026-11" };
  const [y, m] = s.month.split("-").map(Number);
  const inMonth = (r, yy, mm) => { const x = vn(r.at); return x.y === yy && x.m === mm - 1; };
  const prevY = m === 1 ? y - 1 : y, prevM = m === 1 ? 12 : m - 1, prevName = MONTHS[prevM - 1], name = `${MONTHS[m - 1]} ${y}`;
  const options = []; for (let i = 0; i < 12; i++) { const d = new Date(Date.UTC(2026, 10 - i, 1)); const v = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`; options.push(opt(v, `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`, s.month)); }
  const change = (now, before) => {
    if (now === null || before === null) return `<span class="change-none">&ndash;</span>`;
    const d = Math.round((now - before) * 10) / 10;
    return d > 0 ? `<span class="change-up" aria-label="Up ${f1(d)} from ${prevName}">▲ ${f1(d)}</span>` : d < 0 ? `<span class="change-down" aria-label="Down ${f1(-d)} from ${prevName}">▼ ${f1(-d)}</span>` : `<span class="change-same" aria-label="Same as ${prevName}">0</span>`;
  };
  const locRows = db.branches.map((b) => { const now = reviewsOf(b.id).filter((r) => inMonth(r, y, m)), before = reviewsOf(b.id).filter((r) => inMonth(r, prevY, prevM));
    const a = avg(now.reduce((t, r) => t + r.rating, 0), now.length), pa = avg(before.reduce((t, r) => t + r.rating, 0), before.length);
    return `<tr><th scope="row">${link(`location-${b.id}`, esc(b.name), "")}</th><td>${now.length}</td><td>${a === null ? "&ndash;" : f1(a)}</td><td>${now.filter(isGood).length}</td><td>${now.filter(isBad).length}</td><td>${change(a, pa)}</td></tr>`; }).join("");
  const tRows = TOPICS.map((t) => { const now = db.reviews.filter((r) => inMonth(r, y, m) && topicsOf(r.text).includes(t)), before = db.reviews.filter((r) => inMonth(r, prevY, prevM) && topicsOf(r.text).includes(t)); return { t, now, d: now.length - before.length }; })
    .filter((x) => x.now.length).map((x) => `<tr><th scope="row">${esc(x.t.label)}</th><td>${x.now.length}</td><td>${x.now.filter(isBad).length}</td><td>${x.d > 0 ? `<span class="change-up">+${x.d}</span>` : x.d < 0 ? `<span class="change-down">${x.d}</span>` : `<span class="change-same" aria-label="Same as ${prevName}">0</span>`}</td></tr>`).join("");
  return shell("reports", "Monthly report", "Reviews and average score per location for one month (Vietnam time).", `<div class="export-action"><button class="button" type="button" data-action="export-report">Export CSV</button></div>`, `
  <section class="panel"><header class="panel-head"><h2>Locations</h2><p>${name}</p></header>
    <form class="filters" data-action="report-month" aria-label="Choose a month"><div class="field"><label for="report-month">Month</label><select id="report-month" name="month">${options.join("")}</select></div><div class="filter-actions"><button class="button button-apply" type="submit">Show</button></div></form>
    <div class="fade-swap">${db.branches.length ? `<div class="table-wrap"><table class="table report-table"><thead><tr><th scope="col">Location</th><th scope="col">Reviews</th><th scope="col">Average</th><th scope="col">Good (4–5)</th><th scope="col">Bad (1–2)</th><th scope="col">vs ${prevName}</th></tr></thead><tbody>${locRows}</tbody></table></div>` : `<p class="report-note muted">No locations yet.</p>`}</div></section>
  <section class="panel" id="report-topics"><header class="panel-head"><h2>Topics</h2><p>Reviews per topic in ${name}</p></header>
    ${tRows ? `<div class="table-wrap"><table class="table report-table"><thead><tr><th scope="col">Topic</th><th scope="col">Reviews</th><th scope="col">Bad</th><th scope="col">Change vs ${prevName}</th></tr></thead><tbody>${tRows}</tbody></table></div>` : `<p class="muted">No reviews mention a topic in ${name}.</p>`}</section>`);
};

/* ---- Topics ---- */
S.topics = () => {
  const s = ui.topics ||= { location: "", period: "" };
  const list = db.reviews.filter((r) => (!s.location || r.b === +s.location) && (!s.period || NOW - r.at <= +s.period * 86400e3));
  const rows = TOPICS.map((t) => { const w = list.filter((r) => topicsOf(r.text).includes(t)); return { t, w, bad: w.filter(isBad).length }; }).filter((x) => x.w.length).sort((a, b) => b.w.length - a.w.length || b.bad - a.bad || a.t.label.localeCompare(b.t.label));
  const none = list.filter((r) => !topicsOf(r.text).length).length;
  return shell("topics", "Topics", "What customers talk about, by topic.", "", `<section class="panel"><header class="panel-head"><h2>Topics</h2><p id="topics-summary">${plural(list.length, "review")} · ${none} mention${none === 1 ? "s" : ""} no topic</p></header>
    <form class="filters" data-action="topics" aria-label="Filter topics">
      <div class="field"><label for="topics-location">Location</label><select id="topics-location" name="location">${opt("", "All locations", s.location)}${db.branches.map((b) => opt(b.id, b.name, s.location)).join("")}</select></div>
      <div class="field"><label for="topics-period">Period</label><select id="topics-period" name="period">${opt("", "All time", s.period)}${opt("30", "Last 30 days", s.period)}${opt("90", "Last 90 days", s.period)}</select></div>
      <div class="filter-actions"><button class="button button-apply" type="submit">Apply</button></div></form>
    <div class="fade-swap">${rows.length ? `<div class="table-wrap"><table class="table" id="topics-table"><thead><tr><th scope="col">Topic</th><th scope="col">Reviews</th><th scope="col">Share</th><th scope="col">Bad</th><th scope="col">Average rating</th><th scope="col">Details</th></tr></thead><tbody>${rows.map((x) => `<tr><th scope="row">${esc(x.t.label)}</th><td>${x.w.length}</td><td>${pct(x.w.length, list.length)}%</td><td>${x.bad ? `${x.bad} (${pct(x.bad, x.w.length)}%)` : 0}</td><td>${f1(avg(x.w.reduce((t, r) => t + r.rating, 0), x.w.length))}</td><td><a href="#reviews-topic-${x.t.slug}">See reviews</a></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><h2>No topics yet</h2><p>No review in this selection mentions a topic.</p></div>`}</div></section>`);
};

/* ---- Compare ---- */
function sideOf(id, period) {
  const b = branch(id), rs = reviewsOf(id).filter((r) => !period || NOW - r.at <= +period * 86400e3);
  return { b, rs, a: avg(rs.reduce((t, r) => t + r.rating, 0), rs.length), good: pct(rs.filter(isGood).length, rs.length), bad: pct(rs.filter(isBad).length, rs.length), sp: speedOf(rs).percent };
}
S.compare = () => {
  const s = ui.compare ||= { a: "", b: "", period: "" };
  const locs = (v) => opt("", "Choose a location", v) + db.branches.map((b) => opt(b.id, b.name, v)).join("");
  let result = `<p class="compare-message">Pick two locations to compare.</p>`;
  if (s.a && s.b && s.a === s.b) result = `<p class="compare-message is-bad" role="alert">Pick two different locations.</p>`;
  else if (s.a && s.b) {
    const A = sideOf(+s.a, s.period), B = sideOf(+s.b, s.period);
    let verdict = "";
    if (A.a !== null && B.a !== null) { const d = Math.round((A.a - B.a) * 10) / 10; verdict = d === 0 ? "Same score" : `${A.b.name} scores ${f1(Math.abs(d))} ${d > 0 ? "higher" : "lower"} than ${B.b.name}`; }
    const cell = (v, suffix = "%") => v === null ? "—" : v + suffix;
    const starRows = [5, 4, 3, 2, 1].map((n) => { const ca = A.rs.filter((r) => r.rating === n).length, cb = B.rs.filter((r) => r.rating === n).length, pa = pct(ca, A.rs.length) ?? 0, pb = pct(cb, B.rs.length) ?? 0;
      return `<tr><th scope="row">${n} ★</th><td>${ca} (${pa}%)<span class="compare-bar"><span data-w="${pa}%" style="width: 0%"></span></span></td><td>${cb} (${pb}%)<span class="compare-bar"><span data-w="${pb}%" style="width: 0%"></span></span></td></tr>`; }).join("");
    const topicRows = TOPICS.map((t) => { const wa = A.rs.filter((r) => topicsOf(r.text).includes(t)), wb = B.rs.filter((r) => topicsOf(r.text).includes(t)); return { t, wa, wb }; }).filter((x) => x.wa.length || x.wb.length)
      .map((x) => `<tr><th scope="row">${esc(x.t.label)}</th><td>${x.wa.length}${x.wa.filter(isBad).length ? ` · ${x.wa.filter(isBad).length} bad` : ""}</td><td>${x.wb.length}${x.wb.filter(isBad).length ? ` · ${x.wb.filter(isBad).length} bad` : ""}</td></tr>`).join("");
    result = `<div class="fade-swap">${verdict ? `<p class="compare-verdict" id="compare-verdict">${esc(verdict)}</p>` : ""}<div class="table-wrap"><table class="compare-table" id="compare-table"><thead><tr><td></td><th scope="col">${esc(A.b.name)}</th><th scope="col">${esc(B.b.name)}</th></tr></thead><tbody>
      <tr><th scope="row">Score</th><td>${A.a === null ? "No score yet" : f1(A.a)}</td><td>${B.a === null ? "No score yet" : f1(B.a)}</td></tr>
      <tr><th scope="row">Reviews</th><td>${A.rs.length}</td><td>${B.rs.length}</td></tr>
      <tr><th scope="row">Good reviews</th><td>${cell(A.good)}</td><td>${cell(B.good)}</td></tr>
      <tr><th scope="row">Bad reviews</th><td>${cell(A.bad)}</td><td>${cell(B.bad)}</td></tr>
      <tr><th scope="row">Replied in 24h</th><td>${cell(A.sp)}</td><td>${cell(B.sp)}</td></tr>${starRows}</tbody></table></div>
      <section class="compare-topics panel-head" id="compare-topics" aria-label="What customers talk about" style="padding: 16px 20px 0"><h2>What customers talk about</h2></section>
      ${topicRows ? `<div class="table-wrap"><table class="compare-table"><thead><tr><td></td><th scope="col">${esc(A.b.name)}</th><th scope="col">${esc(B.b.name)}</th></tr></thead><tbody>${topicRows}</tbody></table></div>` : `<p class="compare-message">No topics found for these locations in this period.</p>`}</div>`;
  }
  return shell("compare", "Compare locations", "Two locations side by side for a period.", s.a && s.b && s.a !== s.b ? `<button class="button" type="button" data-action="export-compare">Download CSV</button>` : "", `<section class="panel">
    <form class="filters" id="compare-form" data-action="compare" aria-label="Compare locations">
      <div class="field"><label for="compare-a">Location A</label><select id="compare-a" name="a">${locs(s.a)}</select></div>
      <div class="field"><label for="compare-b">Location B</label><select id="compare-b" name="b">${locs(s.b)}</select></div>
      <div class="field"><label for="compare-period">Period</label><select id="compare-period" name="period">${opt("", "All time", s.period)}${opt("30", "Last 30 days", s.period)}${opt("90", "Last 90 days", s.period)}</select></div>
      <div class="filter-actions"><button class="button button-apply" type="submit">Compare</button></div></form>${result}</section>`);
};

      <p class="muted settings-hint" id="id_new_password1_helptext">At least 8 characters, not only numbers, not a common password and not like your username.</p>
      <button type="submit" class="button">Change password</button></form></section>
  <section class="panel settings-panel" id="settings-locations"><h2>Locations</h2>${notice(s.locNotice, "locations-saved")}

    <h3>Add a location</h3>

    ${db.branches.length ? `<form class="settings-form" data-action="goals" novalidate>${db.branches.map(goalField).join("")}<button type="submit" class="button">Save goals</button></form>` : `<p class="muted">Add a location first.</p>`}</section>
  <section class="panel settings-panel" id="settings-templates"><h2>Reply templates</h2>${notice(s.tplNotice, "templates-saved")}<p class="muted">Use {location} for the location's name.</p>

S.editTemplate = (id) => {

    <div><h3>Outside services</h3>${seg("failures", [[false, "Working"], [true, "Failing"]])}</div>
    <div><h3>Screen width</h3>${seg("phone", [[false, "Full"], [true, "Phone 390 px"]])}</div>
    <div><h3>Screens and states</h3>${Object.entries(groups).map(([g, items]) => `<p class="proto-note" style="margin-top:6px">${g}</p><ul class="proto-list">${items.map(([id, l]) => `<li><a href="#${id}"${id === current ? ' aria-current="true"' : ""}>${l}<code>#${id}</code></a></li>`).join("")}</ul>`).join("")}</div>
    <div><button type="button" class="button" data-proto="reset">Reset demo data</button></div></div>`;
  root.querySelectorAll(".proto-list a").forEach((a) => a.addEventListener("click", () => { const id = a.getAttribute("href").slice(1); P.signedIn = true; if (!id.endsWith("-empty") && P.data === "empty") resetFor("demo"); if (id === current) render(); }));
  root.querySelectorAll("[data-proto]").forEach((btn) => btn.addEventListener("click", () => {
    const k = btn.dataset.proto;
    if (k === "reset") { resetFor(P.data); P.signedIn = true; render(); toast("Demo data reset"); return; }
    if (k === "data") { resetFor(btn.dataset.value); render(); toast(btn.dataset.value === "empty" ? "Empty account" : "Demo data loaded"); return; }
    P[k] = btn.dataset.value === "true"; if (k === "phone") app.classList.toggle("is-phone", P.phone); renderProto();
  }));
}

if (!location.hash) history.replaceState(null, "", "#dashboard");
render();
</script>
